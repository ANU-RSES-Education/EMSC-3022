project:
  type: book
  output-dir: ../_build/book

book:
  title: "Planetary Sciences (EMSC 3022)"
  author:
    - "Louis Moresi"
  date: "01/07/2025"
  bread-crumbs: True
  chapters:
    - part: "**Geodynamics and Planetary Interiors**"
      chapters:
        - index.qmd

    - part: "**Preamble**"
      chapters:
        - LectureMaterials/SolarSystemSolidPlanets.qmd

    - part: "**Lectures**"
      chapters:
        - LectureMaterials/Solid-Planets-1.qmd
        - LectureMaterials/Solid-Planets-2.qmd
        - LectureMaterials/Solid-Planets-3.qmd

  navbar:
    search: true
    logo: assets/ANU-logo.png
    background: "#C58812"  # ANU honey colour
    foreground: white

  sidebar:
    logo: assets/AuWorldEQ.jpg
    style: "docked"
    background: light

bibliography: references.bib

execute:
  enabled: false

format:
  live-html:
    theme: [cosmo, "assets/theme.scss"]
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-fold: false
    linkcolor: "#C58812"
    number-sections: false
    number-depth: 1
    # filters:
    #   - pyodide

    # code-links:
    #   - text: Open in Binder
    #     icon: rocket-takeoff
    #     href: https://mybinder.org/v2/gh/ANU-RSES-Education/EMSC-getting-going-with-python/HEAD?labpath=WebBook/BinderLandingPage.qmd

    other-links:
      - text: Github Repository
        icon: github
        href: https://github.com/ANU-RSES-Education/EMSC-3022

pyodide:
  packages:
    - micropip
    - netcdf4
    - xarray
    - pydap
    - jinja2
    - ssl
    - owslib

